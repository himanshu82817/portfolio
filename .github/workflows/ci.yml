name: CI

# Validation runs on pull requests and on master. Previously the only build
# happened inside the deploy job, i.e. after code had already landed — a broken
# commit was discovered by the deploy failing, or worse, by it succeeding.
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:ci

      - name: Production build
        run: npm run build

      # Already run by the build's postbuild step; repeated so the artifact below,
      # which anyone signed in to GitHub can download, is checked however it was built.
      - name: No unpublished case studies in the build
        run: npm run check:dist

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/portfolio/browser
          retention-days: 7
