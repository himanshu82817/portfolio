<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Abstract illustration of course cards with completion progress">
  <defs>
    <linearGradient id="lms-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d1633"/>
      <stop offset="100%" stop-color="#120e21"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#lms-bg)"/>
  <circle cx="520" cy="80" r="120" fill="#6b4eff" opacity="0.16"/>
  <circle cx="90" cy="350" r="90" fill="#6b4eff" opacity="0.10"/>

  <!-- course cards -->
  <g transform="translate(60 70)">
    <rect width="230" height="120" rx="18" fill="#ffffff" opacity="0.07"/>
    <rect x="20" y="22" width="60" height="60" rx="14" fill="#6b4eff" opacity="0.55"/>
    <rect x="96" y="26" width="110" height="10" rx="5" fill="#ffffff" opacity="0.45"/>
    <rect x="96" y="46" width="76" height="8" rx="4" fill="#ffffff" opacity="0.2"/>
    <rect x="20" y="94" width="190" height="7" rx="3.5" fill="#ffffff" opacity="0.12"/>
    <rect x="20" y="94" width="130" height="7" rx="3.5" fill="#6b4eff"/>
  </g>

  <g transform="translate(310 70)">
    <rect width="230" height="120" rx="18" fill="#ffffff" opacity="0.07"/>
    <rect x="20" y="22" width="60" height="60" rx="14" fill="#a791ff" opacity="0.5"/>
    <rect x="96" y="26" width="90" height="10" rx="5" fill="#ffffff" opacity="0.45"/>
    <rect x="96" y="46" width="110" height="8" rx="4" fill="#ffffff" opacity="0.2"/>
    <rect x="20" y="94" width="190" height="7" rx="3.5" fill="#ffffff" opacity="0.12"/>
    <rect x="20" y="94" width="72" height="7" rx="3.5" fill="#a791ff"/>
  </g>

  <!-- progress ring -->
  <g transform="translate(300 290)">
    <circle r="52" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="12"/>
    <circle r="52" fill="none" stroke="#6b4eff" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="245 327" transform="rotate(-90)"/>
    <circle r="30" fill="#6b4eff" opacity="0.18"/>
  </g>

  <!-- roster rows -->
  <g transform="translate(60 250)" opacity="0.85">
    <rect width="150" height="9" rx="4.5" fill="#ffffff" opacity="0.3"/>
    <rect y="26" width="110" height="9" rx="4.5" fill="#ffffff" opacity="0.16"/>
    <rect y="52" width="132" height="9" rx="4.5" fill="#ffffff" opacity="0.16"/>
  </g>
  <g transform="translate(400 250)" opacity="0.85">
    <rect width="130" height="9" rx="4.5" fill="#ffffff" opacity="0.3"/>
    <rect y="26" width="96" height="9" rx="4.5" fill="#ffffff" opacity="0.16"/>
    <rect y="52" width="120" height="9" rx="4.5" fill="#ffffff" opacity="0.16"/>
  </g>
</svg>
