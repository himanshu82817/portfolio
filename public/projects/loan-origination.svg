<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Abstract illustration of a multi-stage loan approval pipeline">
  <defs>
    <linearGradient id="los-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12241a"/>
      <stop offset="100%" stop-color="#0b1a12"/>
    </linearGradient>
    <linearGradient id="los-track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39e079"/>
      <stop offset="70%" stop-color="#39e079"/>
      <stop offset="100%" stop-color="#39e079" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#los-bg)"/>
  <g fill="#39e079" opacity="0.07">
    <circle cx="60" cy="60" r="2"/><circle cx="140" cy="60" r="2"/><circle cx="220" cy="60" r="2"/>
    <circle cx="300" cy="60" r="2"/><circle cx="380" cy="60" r="2"/><circle cx="460" cy="60" r="2"/>
    <circle cx="540" cy="60" r="2"/><circle cx="60" cy="340" r="2"/><circle cx="140" cy="340" r="2"/>
    <circle cx="220" cy="340" r="2"/><circle cx="300" cy="340" r="2"/><circle cx="380" cy="340" r="2"/>
    <circle cx="460" cy="340" r="2"/><circle cx="540" cy="340" r="2"/>
  </g>

  <!-- pipeline rail -->
  <rect x="80" y="196" width="440" height="8" rx="4" fill="#ffffff" opacity="0.08"/>
  <rect x="80" y="196" width="320" height="8" rx="4" fill="url(#los-track)"/>

  <!-- stage nodes -->
  <g>
    <circle cx="80" cy="200" r="20" fill="#39e079"/>
    <path d="M72 200l6 6 11-12" stroke="#12241a" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="240" cy="200" r="20" fill="#39e079"/>
    <path d="M232 200l6 6 11-12" stroke="#12241a" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="400" cy="200" r="22" fill="#12241a" stroke="#39e079" stroke-width="3"/>
    <circle cx="400" cy="200" r="6" fill="#39e079"/>

    <circle cx="520" cy="200" r="20" fill="#ffffff" opacity="0.12"/>
  </g>

  <!-- form card -->
  <g transform="translate(80 250)">
    <rect width="200" height="96" rx="14" fill="#ffffff" opacity="0.06"/>
    <rect x="18" y="20" width="96" height="9" rx="4.5" fill="#ffffff" opacity="0.35"/>
    <rect x="18" y="42" width="164" height="9" rx="4.5" fill="#ffffff" opacity="0.16"/>
    <rect x="18" y="64" width="130" height="9" rx="4.5" fill="#ffffff" opacity="0.16"/>
  </g>

  <!-- approval badge -->
  <g transform="translate(320 250)">
    <rect width="200" height="96" rx="14" fill="#39e079" opacity="0.12"/>
    <rect x="18" y="20" width="70" height="9" rx="4.5" fill="#39e079" opacity="0.8"/>
    <rect x="18" y="44" width="150" height="26" rx="8" fill="#39e079" opacity="0.25"/>
  </g>

  <g transform="translate(80 90)">
    <rect width="150" height="10" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect y="26" width="92" height="8" rx="4" fill="#39e079" opacity="0.55"/>
  </g>
</svg>
