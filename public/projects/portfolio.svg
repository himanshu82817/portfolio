<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Abstract illustration of this portfolio site: a dot grid with the H monogram tile">
  <defs>
    <pattern id="pf-dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#39e079" opacity="0.22"/>
    </pattern>
    <linearGradient id="pf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a16"/>
      <stop offset="100%" stop-color="#111110"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#pf-bg)"/>
  <rect width="600" height="400" fill="url(#pf-dots)"/>

  <!-- monogram tile -->
  <g transform="translate(300 176) rotate(3)">
    <rect x="-56" y="-56" width="112" height="112" rx="28" fill="#39e079"/>
    <path d="M-22 -28 v56 M22 -28 v56 M-22 0 h44" stroke="#181811" stroke-width="13"
          stroke-linecap="round" fill="none"/>
  </g>

  <!-- nav pill -->
  <g transform="translate(300 310)">
    <rect x="-130" y="-24" width="260" height="48" rx="24" fill="#ffffff" opacity="0.08"/>
    <circle cx="-92" r="10" fill="#4286f5"/>
    <circle cx="-42" r="10" fill="#ea4335"/>
    <circle cx="8" r="10" fill="#fabc05"/>
    <circle cx="58" r="10" fill="#36a852"/>
    <rect x="88" y="-9" width="30" height="18" rx="9" fill="#ffffff" opacity="0.18"/>
  </g>

  <rect x="230" y="70" width="140" height="9" rx="4.5" fill="#ffffff" opacity="0.28"/>
</svg>
