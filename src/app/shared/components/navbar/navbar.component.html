<!-- Fixed bottom nav. The safe-area inset keeps it clear of the iOS home
     indicator; --nav-clearance in styles.css reserves the matching page padding. -->
<nav
  aria-label="Main"
  class="fixed left-0 right-0 z-50 flex justify-center px-3 pointer-events-none no-select"
  style="bottom: calc(1.5rem + env(safe-area-inset-bottom))"
>
  <div
    class="pointer-events-auto flex max-w-full items-center gap-2 md:gap-3 rounded-full border border-black/5 dark:border-white/15 bg-[#fdfdfc]/90 dark:bg-surface-elevated/90 px-3 md:px-6 py-2 shadow-elevation-2 backdrop-blur-md md:backdrop-blur-3xl transition-shadow duration-500 hover:shadow-elevation-3"
  >
    <a
      routerLink="/"
      routerLinkActive
      #home="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
      [attr.aria-current]="home.isActive ? 'page' : null"
      aria-label="Home"
      class="group flex min-h-[44px] min-w-[44px] shrink-0 items-center justify-center"
    >
      <span
        class="flex size-10 rotate-3 items-center justify-center rounded-xl bg-primary text-xl font-bold text-on-primary shadow-sm transition-transform duration-300 group-hover:rotate-12"
        aria-hidden="true"
        >H</span
      >
    </a>

    <div
      class="flex min-w-0 items-center gap-1 rounded-full bg-gray-200/80 dark:bg-white/5 p-1 md:p-1.5"
    >
      @for (item of items; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive
          #rla="routerLinkActive"
          ariaCurrentWhenActive="page"
          [attr.aria-label]="item.label"
          [ngClass]="
            rla.isActive
              ? item.activeClass
              : 'text-gray-700 dark:text-gray-200 hover:text-tertiary custom-hover'
          "
          class="group flex min-h-[44px] items-center justify-center gap-2 rounded-full px-3 md:px-5 text-sm font-bold transition-colors duration-300 active:scale-95"
        >
          <span class="material-symbols-outlined text-[20px]" aria-hidden="true">{{
            item.icon
          }}</span>
          <span class="hidden md:block">{{ item.label }}</span>
        </a>
      }
    </div>

    <button
      type="button"
      (click)="toggleTheme()"
      [attr.aria-pressed]="themeService.darkMode()"
      [attr.aria-label]="
        themeService.darkMode() ? 'Switch to light theme' : 'Switch to dark theme'
      "
      class="flex size-11 shrink-0 items-center justify-center rounded-full text-gray-600 dark:text-gray-200 transition-colors hover:bg-gray-100 dark:hover:bg-white/10"
    >
      <span class="material-symbols-outlined" aria-hidden="true">
        {{ themeService.darkMode() ? 'light_mode' : 'dark_mode' }}
      </span>
    </button>
  </div>
</nav>
