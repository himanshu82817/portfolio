<!-- pb reserves room for the fixed bottom nav (--nav-clearance) plus the iOS
     safe area, so the copyright line is never sitting under the nav pill. -->
<footer
  class="border-t border-gray-200/60 dark:border-white/10 bg-white/50 dark:bg-black/20 px-6 pt-12 backdrop-blur-sm transition-colors"
  style="padding-bottom: calc(var(--nav-clearance) + env(safe-area-inset-bottom))"
>
  <div
    class="mx-auto flex max-w-6xl flex-wrap items-center justify-center gap-10 md:justify-between md:gap-6"
  >
    <div class="flex items-center gap-3">
      <span
        class="flex size-10 rotate-3 items-center justify-center rounded-xl bg-black dark:bg-white text-xl font-bold text-white dark:text-black transition-colors"
        aria-hidden="true"
        >H</span
      >
      <span class="text-lg font-bold dark:text-white">{{ site.shortName }}</span>
    </div>

    <ul class="flex list-none gap-4">
      <li>
        <a
          [href]="site.social.linkedin"
          target="_blank"
          rel="noopener noreferrer"
          class="flex rounded-full bg-gray-100 dark:bg-white/10 p-3 text-gray-700 dark:text-gray-200 transition-all duration-300 hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black"
        >
          <span class="sr-only">LinkedIn (opens in a new tab)</span>
          <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"
            ></path>
          </svg>
        </a>
      </li>
      <li>
        <a
          [href]="site.social.github"
          target="_blank"
          rel="noopener noreferrer"
          class="flex rounded-full bg-gray-100 dark:bg-white/10 p-3 text-gray-700 dark:text-gray-200 transition-all duration-300 hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black"
        >
          <span class="sr-only">GitHub (opens in a new tab)</span>
          <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
            ></path>
          </svg>
        </a>
      </li>
      <li>
        <a
          [href]="'mailto:' + site.email"
          class="flex rounded-full bg-gray-100 dark:bg-white/10 p-3 text-gray-700 dark:text-gray-200 transition-all duration-300 hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black"
        >
          <span class="sr-only">Email {{ site.name }}</span>
          <span class="material-symbols-outlined text-[20px]" aria-hidden="true">mail</span>
        </a>
      </li>
    </ul>

    <p class="text-sm font-medium text-gray-600 dark:text-gray-400">
      © {{ currentYear }} {{ site.name }}. All rights reserved.
    </p>
  </div>
</footer>
