  <!--
    Applies the theme before the first paint, so dark-mode visitors never see a
    white flash. Must stay in sync with ThemeService in
    src/app/core/services/theme.service.ts — same storage key, same fallback.
    Kept inline and blocking on purpose: it has to run before any CSS renders.
  -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var dark = stored === 'dark' || stored === 'light'
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        var root = document.documentElement;
        if (dark) root.classList.add('dark');
        root.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) { /* storage blocked — fall through to the light default */ }
    })();
  </script>
