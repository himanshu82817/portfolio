# Server block for the Cloud Run container (dev.himanshusehlangia.dev).
#
# The same rules as deploy/nginx.conf, the VM's config, with two differences:
# it listens on 8080 (Cloud Run's container port — TLS ends at Google's front
# end), and every response carries X-Robots-Tag: noindex, so the dev copy never
# competes with the real site in search results.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cloud Run forwards plain HTTP on 8080. Left on, nginx would build its own
    # redirects (a missing trailing slash, say) as http://host:8080/...
    absolute_redirect off;

    include /etc/nginx/snippets/headers.conf;

    # Every unknown path is handed to index.html so the Angular router can resolve
    # it (and render the 404 route for genuinely unknown URLs).
    #
    # Deliberately no `$uri/` term. public/projects/ is a real directory AND
    # /projects is an Angular route: with `$uri/` nginx sees the directory, answers
    # 301 to /projects/ and then 403, so refreshing the Projects page breaks.
    # Testing `$uri` as a file only lets the route fall through to index.html.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/headers.conf;
        try_files $uri /index.html;
    }

    # nginx has no MIME type for .webmanifest and would send it as a download.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/headers.conf;
    }

    # Only files with a content hash in their name are immutable. Everything in
    # public/ keeps its name across releases — the portrait, the background
    # tiles, the icons — so it falls through to the revalidating rule above, or
    # a changed image would not reach a returning visitor for a year.
    location ~* "-[A-Z0-9]{8}\.(?:js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached, or visitors keep loading the old bundle
    # hashes after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/headers.conf;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/manifest+json image/svg+xml;
}
