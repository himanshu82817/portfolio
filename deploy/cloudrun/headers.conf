# Response headers for every request to the dev container.
#
# A file of its own because nginx does not merge add_header across levels: a
# location that sets any header of its own silently drops every header inherited
# from the server block. Each such location includes this file again.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# Dev only. A header rather than a robots.txt Disallow: a crawler has to be
# allowed to fetch the page to see that it must not index it.
add_header X-Robots-Tag "noindex, nofollow" always;
