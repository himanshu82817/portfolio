# Server block for the portfolio.
#
# The SPA fallback (`try_files ... /index.html`) is the important line: without it
# a visitor who refreshes /projects, or follows a shared deep link, gets a 404 from
# nginx before Angular's router ever runs.
#
# Install on the VM:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/portfolio
#   sudo ln -sf /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/portfolio
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html;
    index index.html;

    # Every unknown path is handed to index.html so the Angular router can resolve
    # it (and render the 404 route for genuinely unknown URLs).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build artefacts are immutable — cache them hard.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|webp|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached, or visitors keep loading the old bundle
    # hashes after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/manifest+json image/svg+xml;

    # Modest hardening for a static site.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
