# Server block for the portfolio.
#
# The SPA fallback (`try_files ... /index.html`) is the important line: without it
# a visitor who refreshes /projects, or follows a shared deep link, gets a 404 from
# nginx before Angular's router ever runs.
#
# Install on the VM:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/portfolio
#   sudo ln -sf /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/portfolio
#   sudo nginx -t && sudo systemctl reload nginx
#
# If certbot manages HTTPS on the VM it has written its own `listen 443 ssl` and
# certificate lines into the installed copy. Copying this file over it removes
# them — either merge the `location` blocks by hand, or run
# `sudo certbot --nginx` again afterwards to put them back.
#
# The container for the dev environment has its own copy of these rules in
# deploy/cloudrun/nginx.conf; keep the two in step.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html;
    index index.html;

    # Every unknown path is handed to index.html so the Angular router can resolve
    # it (and render the 404 route for genuinely unknown URLs). Anything served
    # from here revalidates: a cheap 304 when nothing changed.
    #
    # Deliberately no `$uri/` term. public/projects/ is a real directory AND
    # /projects is an Angular route: with `$uri/` nginx sees the directory, answers
    # 301 to /projects/ and then 403, so refreshing the Projects page breaks.
    # Testing `$uri` as a file only lets the route fall through to index.html.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri /index.html;
    }

    # nginx has no MIME type for .webmanifest and would send it as a download.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Only files with a content hash in their name are immutable. Everything in
    # public/ keeps its name across releases — the portrait, the background
    # tiles, the icons — and used to be cached for a year as well, so a changed
    # image never reached a returning visitor. Those now fall through to the
    # revalidating rule above.
    location ~* "-[A-Z0-9]{8}\.(?:js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached, or visitors keep loading the old bundle
    # hashes after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/manifest+json image/svg+xml;

    # nginx does not merge add_header across levels: a location that sets any
    # header of its own drops everything inherited from here, which is why each
    # location above repeats the hardening headers rather than relying on a
    # server-level declaration.
}
